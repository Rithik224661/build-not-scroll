<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover B: Versus</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 600; src: url('./fonts/Geist-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('./fonts/Geist-Black.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 600; src: url('./fonts/GeistMono-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 700; src: url('./fonts/GeistMono-Bold.woff2') format('woff2'); }
  :root { --ink: #F2F3F5; --ink-2: rgba(242,243,245,.56); --ink-3: rgba(242,243,245,.36); --mint: #7EF0C4; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    /* warm graphite studio: soft overhead spot, falls off into near-black */
    background:
      radial-gradient(760px 900px at 60% 66%, rgba(64,62,58,.55) 0%, rgba(64,62,58,0) 70%),
      radial-gradient(1300px 1000px at 50% 40%, #1B1C1F 0%, #121316 55%, #0B0B0D 100%);
  }
  .back { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(330px 620px at 66% 58%, rgba(126,240,196,.10) 0%, rgba(126,240,196,0) 70%); }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .30;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(1200px 1500px at 52% 55%, rgba(0,0,0,0) 50%, rgba(0,0,0,.5) 100%); }

  .series { position: absolute; left: 96px; top: 296px; display: flex; gap: 20px; align-items: baseline; color: var(--ink); }
  .series b { font: 600 32px/1 'Geist Mono'; }
  .series i { font: 600 32px/1 'Geist'; font-style: normal; color: var(--ink-2); }
  h1 { position: absolute; left: 88px; right: 60px; top: 356px; margin: 0; color: var(--ink);
       font: 900 196px/.86 'Geist'; letter-spacing: -10px; }
  h1 em { font-style: normal; color: var(--mint); text-shadow: 0 0 60px rgba(126,240,196,.28); }
  h1 .l2 { display: block; font-size: 112px; letter-spacing: -5px; line-height: 1; margin-top: 18px; color: var(--ink); }

  .lab { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .lab .n { font: 700 36px/1 'Geist Mono'; letter-spacing: -.5px; }
  .lab .v { font: 600 30px/1 'Geist Mono'; margin-top: 12px; }
  .lab.t .n { color: rgba(242,243,245,.62); } .lab.t .v { color: var(--ink-3); }
  .lab.i .n { color: var(--mint); } .lab.i .v { color: rgba(126,240,196,.62); }
  .foot { position: absolute; left: 0; right: 0; top: 1636px; text-align: center; font: 600 24px/1 'Geist Mono'; color: var(--ink-3); letter-spacing: .2px; }
</style>
</head>
<body>
<div class="back"></div>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div class="grain"></div>
<div class="series"><b>003</b><i>build &gt; scroll</i></div>
<h1><em>17x</em> faster<span class="l2">than Tesseract.</span></h1>
<div class="lab t" id="labT"><div class="n">Tesseract 5</div><div class="v">1x</div></div>
<div class="lab i" id="labI"><div class="n">Indra OCR</div><div class="v">17x</div></div>
<div class="foot">throughput · Datalab 32-core CPU benchmark</div>

<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await document.fonts.load('700 30px "Geist Mono"'); await document.fonts.load('600 30px "Geist Mono"'); await document.fonts.load('900 40px Geist');
const W = 1080, H = 1920, DPR = window.devicePixelRatio, Q = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(DPR); r.setSize(W, H, false);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.22;

// long lens (honest proportions), low 3/4 view
const CAM = (Q.get('cam') || '-19,1.7,34,0.0,2.45,0,-74,18').split(',').map(Number);
const cam = new THREE.PerspectiveCamera(CAM[7], W / H, 0.1, 200);
cam.position.set(CAM[0], CAM[1], CAM[2]); cam.lookAt(CAM[3], CAM[4], CAM[5]);
if (CAM[6]) cam.setViewOffset(W, H, 0, CAM[6], W, H);

// lighting: warm overhead key (soft spot), cool-mint rim on the tall stack, faint fill
const key = new THREE.SpotLight(0xfff3e6, 420, 60, 0.42, 0.85, 2); key.position.set(3, 22, 12); key.target.position.set(0.5, 2, 0);
key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 10; key.shadow.bias = -0.0003; key.shadow.camera.near = 5; key.shadow.camera.far = 50;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x9ff5d6, 1.6); rim.position.set(8, 6, -6); scene.add(rim);
const fill = new THREE.DirectionalLight(0xc8ccd4, 0.35); fill.position.set(-10, 4, 8); scene.add(fill);

// floor catches the shadow + a soft spot pool (CSS supplies the colour)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.5 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.0; ground.receiveShadow = true; scene.add(ground);

// matte plinth
const plinthM = new THREE.MeshPhysicalMaterial({ color: 0x1d1e21, roughness: 0.78, metalness: 0.0, clearcoat: 0.15, clearcoatRoughness: 0.6 });
const plinth = new THREE.Mesh(new RoundedBoxGeometry(6.6, 1.0, 3.6, 6, 0.06), plinthM);
plinth.position.y = -0.5; plinth.castShadow = true; plinth.receiveShadow = true; scene.add(plinth);
// thin bright edge on the plinth's top front, like a machined chamfer catching light
const chamfer = new THREE.Mesh(new THREE.BoxGeometry(6.48, 0.008, 0.008), new THREE.MeshBasicMaterial({ color: 0x5a5b5f }));
chamfer.position.set(0, -0.004, 1.8); scene.add(chamfer);

// paper: reams with page-edge side textures, slight jitter so it reads as a real stack
let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
function edgeTex(tint, lines = 22) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  x.fillStyle = tint; x.fillRect(0, 0, 512, 256);
  for (let i = 0; i < lines; i++) { const y = (i + 0.5) * 256 / lines; x.fillStyle = `rgba(0,0,0,${0.14 + rnd() * 0.18})`; x.fillRect(0, y, 512, 2); x.fillStyle = `rgba(255,255,255,${0.16 + rnd() * 0.12})`; x.fillRect(0, y + 2.4, 512, 1.4); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t;
}
function topTex(dark) {
  const c = document.createElement('canvas'); c.width = 680; c.height = 880; const x = c.getContext('2d');
  if (!dark) {
    x.fillStyle = '#E9E7E1'; x.fillRect(0, 0, 680, 880); x.fillStyle = '#2B2E33'; x.fillRect(60, 70, 300, 30);
    for (let i = 0; i < 16; i++) { x.fillStyle = 'rgba(43,46,51,.42)'; x.fillRect(60, 140 + i * 40, 420 + rnd() * 140, 11); }
  } else {
    x.fillStyle = '#0B1014'; x.fillRect(0, 0, 680, 880); x.fillStyle = '#7EF0C4'; x.font = '700 64px "Geist Mono"'; x.fillText('#', 60, 118); x.fillRect(110, 78, 260, 36);
    for (let i = 0; i < 13; i++) { x.fillStyle = i % 4 === 0 ? 'rgba(126,240,196,.85)' : 'rgba(220,228,236,.55)'; x.fillRect(i % 4 === 0 ? 60 : 96, 170 + i * 48, 340 + rnd() * 180, 13); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t;
}
const PW = 1.36, PD = 1.76, RH = 0.26;              // one ream = one unit of throughput
const greySide = new THREE.MeshStandardMaterial({ map: edgeTex('#9a9b9d'), roughness: 0.95 });
const whiteSide = new THREE.MeshStandardMaterial({ map: edgeTex('#ecebe6'), roughness: 0.9 });
const greyTop = new THREE.MeshStandardMaterial({ map: topTex(false), roughness: 0.9, color: 0xa9aaad });
const mdTop = new THREE.MeshBasicMaterial({ map: topTex(true), toneMapped: false });
const plainTop = new THREE.MeshStandardMaterial({ color: 0xecebe6, roughness: 0.9 });
const reamGeo = new THREE.BoxGeometry(PW, RH, PD);
function stack(n, x, sideM, topM, jitter) {
  const g = new THREE.Group(); g.position.x = x; scene.add(g);
  for (let i = 0; i < n; i++) {
    const last = i === n - 1;
    const m = new THREE.Mesh(reamGeo, [sideM, sideM, last ? topM : plainTop, sideM, sideM, sideM]);
    m.position.set((rnd() - 0.5) * jitter, RH / 2 + i * RH, (rnd() - 0.5) * jitter); m.rotation.y = (rnd() - 0.5) * jitter * 0.5;
    m.castShadow = true; m.receiveShadow = true; g.add(m);
  }
  return g;
}
const XT = -1.55, XI = 1.25;
stack(1, XT, greySide, greyTop, 0.0);              // Tesseract 5: 1 unit
const tall = stack(17, XI, whiteSide, mdTop, 0.007); // Indra OCR: 17 units (17:1, honest)
const HT = 17 * RH;

// mint glowing edges on the Indra stack: the four vertical corners + top rim
const glowM = new THREE.MeshBasicMaterial({ color: 0x7ef0c4, toneMapped: false });
const glowSoft = [0.05, 0.13].map((w, k) => [w, new THREE.MeshBasicMaterial({ color: 0x7ef0c4, transparent: true, opacity: k ? 0.07 : 0.16, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })]);
for (const [dx, dz] of [[-1, 1], [1, 1], [1, -1]]) {
  const cx = XI + dx * (PW / 2 + 0.004), cz = dz * (PD / 2 + 0.004);
  const e = new THREE.Mesh(new THREE.BoxGeometry(0.012, HT, 0.012), glowM); e.position.set(cx, HT / 2, cz); scene.add(e);
  for (const [w, m] of glowSoft) { const g = new THREE.Mesh(new THREE.BoxGeometry(w, HT, w), m); g.position.set(cx, HT / 2, cz); scene.add(g); }
}
// top rim of the tower glows too
for (const [w, d, x, z] of [[PW, 0.012, XI, PD / 2], [0.012, PD, XI + PW / 2, 0], [0.012, PD, XI - PW / 2, 0], [PW, 0.012, XI, -PD / 2]]) {
  const e = new THREE.Mesh(new THREE.BoxGeometry(w + 0.01, 0.012, d + 0.01), glowM); e.position.set(x, HT + 0.004, z); scene.add(e);
}
// dashed 1x reference line: the Tesseract stack's height carried across to the tower
{
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(XT - PW / 2, RH, PD / 2 + 0.01), new THREE.Vector3(XI + PW / 2 + 0.25, RH, PD / 2 + 0.01)]);
  const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color: 0x9a9da3, dashSize: 0.07, gapSize: 0.06, transparent: true, opacity: 0.7 })); l.computeLineDistances(); scene.add(l);
}
// mint light pool on the plinth under the tall stack + a light spilling up its face
const pc = document.createElement('canvas'); pc.width = pc.height = 256; const px = pc.getContext('2d');
const pg = px.createRadialGradient(128, 128, 0, 128, 128, 128); pg.addColorStop(0, 'rgba(126,240,196,.42)'); pg.addColorStop(1, 'rgba(126,240,196,0)'); px.fillStyle = pg; px.fillRect(0, 0, 256, 256);
const pool = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
pool.rotation.x = -Math.PI / 2; pool.position.set(XI, 0.003, 0.2); scene.add(pool);
const up = new THREE.PointLight(0x7ef0c4, 4, 5, 2); up.position.set(XI + 0.2, 0.3, 1.9); scene.add(up);
const topGlow = new THREE.PointLight(0x7ef0c4, 6, 4, 2); topGlow.position.set(XI, HT + 0.6, 0.4); scene.add(topGlow);

r.render(scene, cam);

// labels on the plinth's front face, under each stack (projected from 3D so they stay attached)
function place(id, x3) {
  const v = new THREE.Vector3(x3, -0.5, 1.81).project(cam);
  const el = document.getElementById(id); el.style.left = ((v.x + 1) / 2 * W) + 'px'; el.style.top = ((1 - v.y) / 2 * H - 28) + 'px';
}
place('labT', XT); place('labI', XI);
const tp = new THREE.Vector3(XI, HT, 0).project(cam), bp = new THREE.Vector3(XI, 0, PD / 2).project(cam);
window.GEOM = { tallTopY: (1 - tp.y) / 2 * H, baseY: (1 - bp.y) / 2 * H };
window.READY = true;
</script>
</body>
</html>
