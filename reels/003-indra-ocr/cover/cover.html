<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover A: Studio</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 600; src: url('./fonts/Geist-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('./fonts/Geist-Black.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 600; src: url('./fonts/GeistMono-SemiBold.woff2') format('woff2'); }
  :root { --ink: #0E1115; --ink-2: rgba(14,17,21,.58); --mint: #7EF0C4; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    /* seamless studio paper: cool light grey, brighter where the key light hits */
    background:
      radial-gradient(900px 700px at 56% 60%, #F7F8F9 0%, rgba(247,248,249,0) 72%),
      radial-gradient(1500px 600px at 50% 92%, rgba(150,156,165,.35) 0%, rgba(150,156,165,0) 70%),
      linear-gradient(180deg, #D6D9DE 0%, #E6E8EB 40%, #E2E4E8 64%, #CBCFD5 100%);
  }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  /* photographic grain + vignette, so it reads as a shot, not a gradient */
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .22;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(1400px 1700px at 55% 52%, rgba(0,0,0,0) 55%, rgba(20,24,30,.22) 100%); }

  .copy { position: absolute; left: 92px; right: 92px; top: 318px; color: var(--ink); }
  .over { font: 600 46px/1 'Geist'; letter-spacing: -.5px; color: var(--ink-2); margin: 0 0 26px 6px; }
  .over s { text-decoration-thickness: 5px; text-decoration-color: rgba(14,17,21,.55); }
  h1 { margin: 0; font: 900 128px/.9 'Geist'; letter-spacing: -6px; }
  h1 .mark { position: relative; white-space: nowrap; }
  h1 .mark::before { content: ''; position: absolute; left: -10px; right: -12px; top: 30%; bottom: -2%; background: var(--mint); z-index: -1; border-radius: 6px; }
  h1 span.l2 { position: relative; z-index: 0; display: inline-block; }

  .series { position: absolute; right: 96px; top: 330px; display: flex; gap: 22px; align-items: baseline; color: var(--ink); }
  .series b { font: 600 34px/1 'Geist Mono'; letter-spacing: 0; }
  .series i { font: 600 34px/1 'Geist'; font-style: normal; color: var(--ink-2); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div class="grain"></div>
<div class="copy">
  <p class="over">1M parameters. No GPU.</p>
  <h1>It reads 49<br><span class="l2"><span class="mark">pages a second.</span></span></h1>
</div>
<div class="series"><b>003</b><i>build &gt; scroll</i></div>

<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await document.fonts.load('600 40px "Geist Mono"'); await document.fonts.load('900 40px Geist');
const W = 1080, H = 1920, DPR = window.devicePixelRatio;
const canvas = document.getElementById('gl');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(DPR); r.setSize(W, H, false);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.9;

const cam = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
const CAM = (new URLSearchParams(location.search).get('cam') || '-7.4,7.6,17.5,0.6,0.95,-0.5,-330').split(',').map(Number);
cam.position.set(CAM[0], CAM[1], CAM[2]); cam.lookAt(CAM[3], CAM[4], CAM[5]);
cam.setViewOffset(W, H, 0, CAM[6], W, H);   // shift the frame so the laptop sits low, under the headline

// key light (soft, from upper right) + fill + rim
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(2.2, 9, 6.5); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 16; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 20 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xdff7ee, 1.1); rim.position.set(-5, 3, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9cdd3, 0.35));

// ground: only catches shadow, the paper colour comes from CSS
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.17 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// contact shadow: a soft dark ellipse right under the laptop
const cs = document.createElement('canvas'); cs.width = cs.height = 256; const cx = cs.getContext('2d');
const gr = cx.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(10,12,16,.55)'); gr.addColorStop(1, 'rgba(10,12,16,0)');
cx.fillStyle = gr; cx.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 3.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cs), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2; contact.position.set(0, 0.002, 0.15); scene.add(contact);

// materials
const alu = new THREE.MeshPhysicalMaterial({ color: 0x3d4248, metalness: 1, roughness: 0.36, clearcoat: 0.25, clearcoatRoughness: 0.35 });
const aluDark = new THREE.MeshPhysicalMaterial({ color: 0x2c3036, metalness: 1, roughness: 0.3 });
const black = new THREE.MeshPhysicalMaterial({ color: 0x0b0d10, metalness: 0.2, roughness: 0.55 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x050607, metalness: 0, roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.03 });

// hero: a stack of real-looking documents, a mint scanner plane slicing through, pages lifting off as Markdown
function pageTex(kind, seed) {
  const c = document.createElement('canvas'); c.width = 680; c.height = 880; const x = c.getContext('2d');
  let s = seed; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  if (kind === 'paper') {
    x.fillStyle = '#F6F5F0'; x.fillRect(0, 0, 680, 880); x.fillStyle = '#25282E'; x.fillRect(60, 70, 330, 34);
    for (let i = 0; i < 16; i++) { x.fillStyle = 'rgba(37,40,46,.5)'; x.fillRect(60, 150 + i * 40, 430 + rnd() * 130, 12); }
    x.strokeStyle = 'rgba(37,40,46,.4)'; x.lineWidth = 3; x.strokeRect(60, 680, 560, 150); x.beginPath(); x.moveTo(60, 730); x.lineTo(620, 730); x.moveTo(60, 780); x.lineTo(620, 780); x.stroke();
  } else {
    x.fillStyle = '#0B1014'; x.fillRect(0, 0, 680, 880); x.fillStyle = '#7EF0C4'; x.font = '700 64px "Geist Mono"'; x.fillText('#', 60, 118); x.fillRect(110, 76, 280, 38);
    for (let i = 0; i < 13; i++) { x.fillStyle = i % 4 === 0 ? 'rgba(126,240,196,.8)' : 'rgba(220,228,236,.55)'; x.fillRect(i % 4 === 0 ? 60 : 96, 170 + i * 48, 360 + rnd() * 170, 13); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t;
}
const PW = 2.1, PD = 2.72, PT = 0.016;
const side = new THREE.MeshStandardMaterial({ color: 0xe4e2db, roughness: 0.92 });
const paper = [3, 7, 13].map((sd) => [side, side, new THREE.MeshStandardMaterial({ map: pageTex('paper', sd), roughness: 0.88 }), side, side, side]);
const md = [5, 11].map((sd) => [side, side, new THREE.MeshBasicMaterial({ map: pageTex('md', sd), toneMapped: false }), side, side, side]);
const geo = new THREE.BoxGeometry(PW, PT, PD);
const stack = new THREE.Group(); scene.add(stack);
for (let i = 0; i < 70; i++) { const m = new THREE.Mesh(geo, paper[i % 3]); m.position.set(Math.sin(i * 1.7) * 0.03, PT / 2 + i * (PT + 0.0015), Math.cos(i * 2.3) * 0.03); m.rotation.y = Math.sin(i * 0.9) * 0.035; m.castShadow = true; m.receiveShadow = true; stack.add(m); }
const top = 70 * (PT + 0.0015);
// scanner: a thin glowing mint sheet just above the stack, with a bright edge line
const sc = document.createElement('canvas'); sc.width = 512; sc.height = 64; const sx = sc.getContext('2d');
const sgr = sx.createLinearGradient(0, 0, 0, 64); sgr.addColorStop(0, 'rgba(126,240,196,0)'); sgr.addColorStop(0.5, 'rgba(126,240,196,.9)'); sgr.addColorStop(1, 'rgba(126,240,196,0)'); sx.fillStyle = sgr; sx.fillRect(0, 0, 512, 64);
const scanY = top + 0.42;
const sheet = new THREE.Mesh(new THREE.PlaneGeometry(PW + 1.1, PD + 1.1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
sheet.rotation.x = -Math.PI / 2; sheet.position.y = scanY; scene.add(sheet);
const edgeM = new THREE.MeshBasicMaterial({ color: 0x5fe0b0, toneMapped: false });
for (const z of [-1, 1]) { const e = new THREE.Mesh(new THREE.BoxGeometry(PW + 1.1, 0.012, 0.012), edgeM); e.position.set(0, scanY, z * (PD + 1.1) / 2); scene.add(e); }
for (const x2 of [-1, 1]) { const e = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, PD + 1.1), edgeM); e.position.set(x2 * (PW + 1.1) / 2, scanY, 0); scene.add(e); }
const glow = new THREE.PointLight(0x7ef0c4, 6, 5, 2); glow.position.set(0, scanY + 0.3, 0.6); scene.add(glow);
// pages lifting off: below the sheet still paper, above it already Markdown
const lift = [[0.12, -0.05, 0.10, 0.06], [0.62, 0.22, -0.16, 0.22], [1.05, 0.5, 0.2, 0.42], [1.42, 0.85, -0.26, 0.66]];
lift.forEach(([h, rx, rz, ry], i) => {
  const m = new THREE.Mesh(geo, top + h > scanY ? md[i % 2] : paper[i % 3]); m.position.set(0.1 + i * 0.42, top + h, -0.1 - i * 0.36);
  m.rotation.set(rx * 0.35, ry, rz * 0.5); m.castShadow = true; scene.add(m);
});
r.render(scene, cam);
window.READY = true;
</script>
</body>
</html>
