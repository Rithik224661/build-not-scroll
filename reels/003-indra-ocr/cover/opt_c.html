<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover C: Before / After</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 600; src: url('./fonts/Geist-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('./fonts/Geist-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('./fonts/Geist-Black.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; src: url('./fonts/GeistMono-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 600; src: url('./fonts/GeistMono-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 700; src: url('./fonts/GeistMono-Bold.woff2') format('woff2'); }
  :root { --ink: #F3F5F8; --dim: rgba(243,245,248,.62); --mint: #7EF0C4; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    /* dark studio desk: a soft pool of light where the page sits, falling off to near-black */
    background:
      radial-gradient(760px 820px at 54% 63%, #222A31 0%, rgba(34,42,49,0) 70%),
      radial-gradient(1200px 900px at 50% 30%, #12171C 0%, rgba(18,23,28,0) 75%),
      linear-gradient(180deg, #0B0E11 0%, #0D1115 45%, #090B0E 100%);
  }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .32;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(1300px 1650px at 52% 55%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%); }

  .copy { position: absolute; left: 86px; right: 86px; top: 282px; color: var(--ink); }
  h1 { margin: 0; font: 900 186px/.86 'Geist'; letter-spacing: -9px; }
  h2 { margin: 18px 0 0; font: 900 104px/.95 'Geist'; letter-spacing: -4.6px; white-space: nowrap; }
  h2 .arrow { color: var(--mint); margin-right: 6px; letter-spacing: 0; }
  h2 .md { color: var(--mint); }
  .sub { margin: 30px 0 0 4px; font: 600 40px/1 'Geist'; letter-spacing: -.4px; color: var(--dim); }
  .sub b { color: var(--ink); font-weight: 700; }

  .series { position: absolute; right: 90px; top: 610px; display: flex; gap: 18px; align-items: baseline; color: var(--ink); }
  .series b { font: 600 32px/1 'Geist Mono'; color: var(--mint); }
  .series i { font: 600 32px/1 'Geist'; font-style: normal; color: var(--dim); }
  .tags { position: absolute; left: 0; top: 0; font: 600 26px/1 'Geist Mono'; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div class="grain"></div>
<div class="copy">
  <h1>Any PDF</h1>
  <h2><span class="arrow">→</span>clean <span class="md">Markdown.</span></h2>
  <p class="sub"><b>1 command.</b> No GPU.</p>
</div>
<div class="series"><b>003</b><i>build &gt; scroll</i></div>

<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

for (const f of ['900 40px Geist', '700 40px Geist', '600 40px Geist', '500 40px "Geist Mono"', '700 40px "Geist Mono"']) await document.fonts.load(f);
const Q = new URLSearchParams(location.search);
const W = 1080, H = 1920, DPR = window.devicePixelRatio;
const canvas = document.getElementById('gl');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(DPR); r.setSize(W, H, false);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

// ---------- the page texture: one document, two states, split by a diagonal scan line ----------
const TW = 1700, TH = 2200;                         // 8.5 x 11 aspect
// split line from (0, A) to (TW, B): above = scanned paper, below = Markdown
const A = TH * 0.70, B = TH * 0.30;
const lineY = (x) => A + (B - A) * (x / TW);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

function drawPaper(x) {
  // warm, slightly uneven scanned paper
  x.fillStyle = '#ECE6D8'; x.fillRect(0, 0, TW, TH);
  const g = x.createRadialGradient(TW * 0.45, TH * 0.4, 200, TW * 0.5, TH * 0.5, TH * 0.8);
  g.addColorStop(0, 'rgba(255,252,244,.55)'); g.addColorStop(1, 'rgba(160,150,128,.28)'); x.fillStyle = g; x.fillRect(0, 0, TW, TH);
  // scanner edge shadow on the left + top
  let e = x.createLinearGradient(0, 0, 70, 0); e.addColorStop(0, 'rgba(60,55,45,.5)'); e.addColorStop(1, 'rgba(60,55,45,0)'); x.fillStyle = e; x.fillRect(0, 0, 70, TH);
  e = x.createLinearGradient(0, 0, 0, 50); e.addColorStop(0, 'rgba(60,55,45,.4)'); e.addColorStop(1, 'rgba(60,55,45,0)'); x.fillStyle = e; x.fillRect(0, 0, TW, 50);
  // content, skewed like a crooked scan
  x.save(); x.translate(TW / 2, TH / 2); x.rotate(-0.026); x.translate(-TW / 2, -TH / 2);
  const ink = 'rgba(34,32,30,.86)';
  x.fillStyle = ink; x.font = '900 118px Geist'; x.letterSpacing = '-2px'; x.fillText('INVOICE', 150, 300);
  x.font = '700 64px Geist'; x.letterSpacing = '0px'; x.fillText('No. 4821', 1180, 290);
  x.fillRect(150, 345, 1400, 7);
  x.font = '600 56px Geist'; x.fillStyle = 'rgba(34,32,30,.8)';
  x.fillText('Billed to:  Acme Labs', 150, 480); x.fillText('Due:  30 Oct 2026', 150, 570);
  x.font = '600 46px Geist'; x.fillStyle = 'rgba(34,32,30,.62)';
  x.fillText('Payment within 14 days. Thank you for your business.', 150, 670);
  // crooked table
  x.strokeStyle = 'rgba(34,32,30,.7)'; x.lineWidth = 5;
  const ty = 780, rows = [['Item', 'Qty', 'Total'], ['Pro plan seats', '3', '$60'], ['Onboarding call', '1', '$30'], ['', 'Total', '$90']];
  rows.forEach((row, i) => {
    const y = ty + i * 150;
    x.beginPath(); x.moveTo(150, y); x.lineTo(1550 + (i % 2) * 6, y + (i % 2 ? 4 : -3)); x.stroke();
    x.font = (i === 0 || i === 3 ? '700 ' : '600 ') + '58px Geist'; x.fillStyle = 'rgba(34,32,30,.84)';
    x.fillText(row[0], 180, y + 98); x.fillText(row[1], 1000, y + 98); x.fillText(row[2], 1330, y + 98);
  });
  x.beginPath(); x.moveTo(150, ty + 600); x.lineTo(1556, ty + 602); x.stroke();
  [150, 960, 1290, 1553].forEach((cx, k) => { x.beginPath(); x.moveTo(cx, ty); x.lineTo(cx + (k === 2 ? 5 : 0), ty + 600); x.stroke(); });
  x.font = '600 50px Geist'; x.fillStyle = 'rgba(34,32,30,.7)';
  x.fillText('Notes: 3 seats, Pro plan. Onboarding call booked.', 150, 1560);
  for (let i = 0; i < 6; i++) { x.fillStyle = 'rgba(34,32,30,.42)'; x.fillRect(150, 1660 + i * 76, 900 + rnd() * 450, 22); }
  x.restore();
  // fold shadow across the page
  e = x.createLinearGradient(0, TH * 0.47, 0, TH * 0.53);
  e.addColorStop(0, 'rgba(80,70,55,0)'); e.addColorStop(0.48, 'rgba(80,70,55,.22)'); e.addColorStop(0.52, 'rgba(255,255,250,.35)'); e.addColorStop(1, 'rgba(80,70,55,0)');
  x.fillStyle = e; x.fillRect(0, TH * 0.47, TW, TH * 0.06);
  // coffee ring (top right)
  x.save(); x.translate(1330, 470);
  for (let k = 0; k < 3; k++) { x.beginPath(); x.ellipse(0, 0, 205 - k * 7, 192 - k * 7, 0.3, 0.2, Math.PI * 1.85); x.strokeStyle = `rgba(122,82,40,${0.22 - k * 0.06})`; x.lineWidth = 14 - k * 3; x.stroke(); }
  const cg = x.createRadialGradient(0, 0, 60, 0, 0, 200); cg.addColorStop(0, 'rgba(140,96,48,0)'); cg.addColorStop(1, 'rgba(140,96,48,.12)'); x.fillStyle = cg; x.beginPath(); x.ellipse(0, 0, 200, 188, 0.3, 0, Math.PI * 2); x.fill();
  x.restore();
  // toner speckle + streak
  for (let i = 0; i < 2600; i++) { const a = rnd() * 0.5; x.fillStyle = `rgba(30,28,25,${a})`; const s = rnd() < 0.96 ? 2 + rnd() * 3 : 5 + rnd() * 7; x.fillRect(rnd() * TW, rnd() * TH, s, s); }
  x.fillStyle = 'rgba(40,38,34,.08)'; x.fillRect(1180, 0, 16, TH);
}

function drawMarkdown(x) {
  x.fillStyle = '#06090C'; x.fillRect(0, 0, TW, TH);
  const g = x.createLinearGradient(0, 0, TW, TH); g.addColorStop(0, 'rgba(126,240,196,.05)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, TW, TH);
  const M = (s, px, py, col, w = 500, sz = 58) => { x.font = `${w} ${sz}px "Geist Mono"`; x.fillStyle = col; x.fillText(s, px, py); };
  const mint = '#7EF0C4', ink = 'rgba(228,234,240,.9)', dim = 'rgba(228,234,240,.45)';
  // same content, same rows as the paper, now clean and straight
  M('#', 150, 300, mint, 700, 110); M('Invoice 4821', 245, 300, ink, 700, 104);
  M('**Billed to:** Acme Labs', 150, 480, ink); M('**Due:** 30 Oct 2026', 150, 570, ink);
  M('> Payment within 14 days.', 150, 670, dim, 500, 50);
  // table mirrors the paper's grid exactly: pipes sit on the paper's column rules, cells on the same baselines
  const ty = 780, cols = [150, 960, 1290, 1553], cells = [200, 1010, 1340];
  const rows = [['Item', 'Qty', 'Total'], ['Pro plan seats', '3', '$60'], ['Onboarding call', '1', '$30']];
  rows.forEach((row, i) => {
    const y = ty + i * 150 + 98;
    cols.forEach((cx) => M('|', cx - 14, y, dim, 500, 56));
    row.forEach((c, k) => M(c, cells[k], y, i === 0 ? mint : ink, i === 0 ? 700 : 500, 56));
  });
  cols.slice(0, 3).forEach((cx, k) => M('-'.repeat(k === 0 ? 22 : 8), cx + 18, ty + 168, dim, 500, 40));
  { const y = ty + 548; cols.forEach((cx) => M('|', cx - 14, y, dim, 500, 56)); M('**Total**', cells[1], y, mint, 700, 44); M('$90', cells[2], y, mint, 700, 56); }
  M('##', 150, 1700, mint, 700, 64); M('Notes', 260, 1700, ink, 700, 64);
  M('-', 150, 1800, mint, 700); M('3 seats, Pro plan', 220, 1800, ink);
  M('-', 150, 1890, mint, 700); M('Onboarding call booked', 220, 1890, ink);
  M('- [x]', 150, 1980, mint, 700); M('reading order kept', 370, 1980, dim);
}

function clipBelow(x, below) {
  x.beginPath();
  if (below) { x.moveTo(0, A); x.lineTo(TW, B); x.lineTo(TW, TH); x.lineTo(0, TH); }
  else { x.moveTo(0, 0); x.lineTo(TW, 0); x.lineTo(TW, B); x.lineTo(0, A); }
  x.closePath(); x.clip();
}
const tex = document.createElement('canvas'); tex.width = TW; tex.height = TH; const tx = tex.getContext('2d');
tx.save(); clipBelow(tx, false); drawPaper(tx); tx.restore();
tx.save(); clipBelow(tx, true); drawMarkdown(tx); tx.restore();
// thin dark seam + bright core line drawn on the albedo too
tx.save(); tx.strokeStyle = '#E9FFF6'; tx.lineWidth = 8; tx.beginPath(); tx.moveTo(-10, lineY(-10)); tx.lineTo(TW + 10, lineY(TW + 10)); tx.stroke(); tx.restore();

// emissive: the scan line glows, the Markdown text glows faintly like a screen
const em = document.createElement('canvas'); em.width = TW; em.height = TH; const ex = em.getContext('2d');
ex.fillStyle = '#000'; ex.fillRect(0, 0, TW, TH);
ex.save(); clipBelow(ex, true); ex.globalAlpha = 0.16; drawMarkdown(ex); ex.restore();
const halo = (w, a) => { ex.save(); ex.strokeStyle = `rgba(126,240,196,${a})`; ex.lineWidth = w; ex.filter = `blur(${w / 2}px)`; ex.beginPath(); ex.moveTo(-40, lineY(-40)); ex.lineTo(TW + 40, lineY(TW + 40)); ex.stroke(); ex.restore(); };
halo(90, 0.22); halo(34, 0.6); halo(12, 1);
ex.save(); ex.strokeStyle = '#F2FFF9'; ex.lineWidth = 7; ex.beginPath(); ex.moveTo(-10, lineY(-10)); ex.lineTo(TW + 10, lineY(TW + 10)); ex.stroke(); ex.restore();

const map = new THREE.CanvasTexture(tex); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 16;
const emap = new THREE.CanvasTexture(em); emap.colorSpace = THREE.SRGBColorSpace; emap.anisotropy = 16;

// ---------- scene ----------
const PW = 2.2, PD = PW * TH / TW;
const cam = new THREE.PerspectiveCamera(Number(Q.get('fov') || 27), W / H, 0.1, 100);
const CAM = (Q.get('cam') || '0.9,10.45,5.15,0.05,0,0.2,-262').split(',').map(Number);
cam.position.set(CAM[0], CAM[1], CAM[2]); cam.lookAt(CAM[3], CAM[4], CAM[5]);
cam.setViewOffset(W, H, 0, CAM[6], W, H);

const key = new THREE.DirectionalLight(0xfff6ea, 2.1); key.position.set(-3.5, 9, 3.2); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 18; key.shadow.bias = -0.0003;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x0a0c0e, 0.25));

// page: thin card, top face carries the texture; one corner of the paper half lifts a little
const geo = new THREE.PlaneGeometry(PW, PD, 80, 100);
const pos = geo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const u = pos.getX(i) / PW + 0.5, v = 0.5 - pos.getY(i) / PD;   // u right, v down (texture space)
  const d = Math.max(0, 0.42 - Math.hypot(u, v)) / 0.42;             // distance from the top-left corner
  pos.setZ(i, 0.16 * d * d);
}
geo.computeVertexNormals();
const mat = new THREE.MeshStandardMaterial({ map, emissiveMap: emap, emissive: 0xffffff, emissiveIntensity: 1.35, roughness: 0.82, metalness: 0, side: THREE.DoubleSide });
const page = new THREE.Mesh(geo, mat); page.rotation.x = -Math.PI / 2; page.rotation.z = Number(Q.get('rz') || 0.11);
page.position.y = 0.012; page.castShadow = true; page.receiveShadow = true; scene.add(page);

// shadow catcher + contact shadow
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.55 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cs = document.createElement('canvas'); cs.width = cs.height = 256; const cx = cs.getContext('2d');
const gr = cx.createRadialGradient(128, 128, 30, 128, 128, 128); gr.addColorStop(0, 'rgba(0,0,0,.65)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
cx.fillStyle = gr; cx.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(new THREE.PlaneGeometry(PW * 1.35, PD * 1.25), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cs), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2; contact.rotation.z = page.rotation.z; contact.position.y = 0.001; scene.add(contact);

// the scan beam spills past the page onto the desk: a long additive glow strip on the floor along the same line
const bs = document.createElement('canvas'); bs.width = 1024; bs.height = 128; const bx = bs.getContext('2d');
const bg = bx.createLinearGradient(0, 0, 0, 128); bg.addColorStop(0, 'rgba(126,240,196,0)'); bg.addColorStop(0.5, 'rgba(126,240,196,1)'); bg.addColorStop(1, 'rgba(126,240,196,0)');
bx.fillStyle = bg; bx.fillRect(0, 0, 1024, 128);
const fade = bx.createLinearGradient(0, 0, 1024, 0); fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(0.3, 'rgba(0,0,0,0)'); fade.addColorStop(0.7, 'rgba(0,0,0,0)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
bx.globalCompositeOperation = 'destination-out'; bx.fillStyle = fade; bx.fillRect(0, 0, 1024, 128);
const beamTex = new THREE.CanvasTexture(bs);
// line in page-local coords: from (u=0,v=A/TH) to (u=1,v=B/TH)
const p0 = new THREE.Vector3(-PW / 2, 0, -PD / 2 + PD * A / TH), p1 = new THREE.Vector3(PW / 2, 0, -PD / 2 + PD * B / TH);
const rot = new THREE.Matrix4().makeRotationY(page.rotation.z); p0.applyMatrix4(rot); p1.applyMatrix4(rot);
const mid = p0.clone().add(p1).multiplyScalar(0.5), dir = p1.clone().sub(p0), len = dir.length();
const beam = new THREE.Mesh(new THREE.PlaneGeometry(len * 2.3, 0.32), new THREE.MeshBasicMaterial({ map: beamTex, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
beam.rotation.x = -Math.PI / 2; beam.rotation.z = Math.atan2(-dir.z, dir.x); beam.position.set(mid.x, 0.004, mid.z); scene.add(beam);
const glow1 = new THREE.PointLight(0x7ef0c4, 1.4, 2.6, 2); glow1.position.set(mid.x - 0.4, 0.35, mid.z); scene.add(glow1);

r.render(scene, cam);
window.READY = true;
</script>
