<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover B: Scale</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 600; src: url('./fonts/Geist-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('./fonts/Geist-Black.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 600; src: url('./fonts/GeistMono-SemiBold.woff2') format('woff2'); }
  :root { --ink: #0C1411; --field: #7EF0C4; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; color: var(--ink);
    background: radial-gradient(1300px 1100px at 40% 38%, #A2F6D6 0%, #7EF0C4 55%, #5FDDAF 100%); }
  .grain { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .18; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .4  0 0 0 0 .35  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .head { position: absolute; left: 92px; right: 92px; top: 316px; }
  .head p { margin: 0 0 22px 4px; font: 600 44px/1.1 'Geist'; letter-spacing: -.4px; opacity: .7; }
  .head h1 { margin: 0; font: 900 118px/.92 'Geist'; letter-spacing: -5.5px; }
  #grid { position: absolute; left: 92px; top: 772px; }
  .legend { position: absolute; left: 92px; right: 92px; top: 1450px; display: flex; justify-content: space-between; align-items: baseline;
    font: 600 34px/1 'Geist Mono'; }
  .legend span:last-child { opacity: .62; }
  .series { position: absolute; right: 92px; top: 330px; font: 600 34px/1 'Geist Mono'; opacity: .75; }
</style>
</head>
<body>
<div class="head">
  <p>Meta's 816B needs 2 Mac Studios.</p>
  <h1>This 9B runs<br>on your laptop.</h1>
</div>
<div class="series">002</div>
<canvas id="grid"></canvas>
<div class="legend"><span>■ 9B  nimble</span><span>1 square = 1B parameters</span></div>
<div class="grain"></div>
<script type="module">
await document.fonts.load('900 40px Geist'); await document.fonts.load('600 40px "Geist Mono"');
// 816 squares: 34 x 24. The 9 that are nimble sit at the top-left, solid ink; the rest are faint outlines.
const COLS = 34, ROWS = 24, S = 21, G = 6, DPR = window.devicePixelRatio;
const cv = document.getElementById('grid'), w = COLS * (S + G) - G, h = ROWS * (S + G) - G;
cv.width = w * DPR; cv.height = h * DPR; cv.style.width = w + 'px'; cv.style.height = h + 'px';
const g = cv.getContext('2d'); g.scale(DPR, DPR);
for (let i = 0; i < COLS * ROWS; i++) {
  const c = i % COLS, r = Math.floor(i / COLS), x = c * (S + G), y = r * (S + G);
  const small = c < 3 && r < 3;
  g.beginPath(); g.roundRect(x, y, S, S, 4);
  if (small) { g.fillStyle = '#0C1411'; g.fill(); }
  else { g.fillStyle = 'rgba(12,20,17,0.13)'; g.fill(); }
}
window.READY = true;
</script>
</body>
</html>
