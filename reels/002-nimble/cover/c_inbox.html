<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover C: Inbox</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 600; src: url('./fonts/Geist-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 700; src: url('./fonts/Geist-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 900; src: url('./fonts/Geist-Black.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 600; src: url('./fonts/GeistMono-SemiBold.woff2') format('woff2'); }
  :root { --ink: #F2F3F1; --dim: rgba(242,243,241,.6); --mint: #7EF0C4; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; color: var(--ink);
    /* graphite studio: one warm overhead light, not a navy glow */
    background:
      radial-gradient(900px 760px at 50% 54%, rgba(255,248,238,.16) 0%, rgba(255,248,238,0) 70%),
      linear-gradient(180deg, #1C1E21 0%, #26292D 50%, #17191B 100%); }
  .grain { position: absolute; inset: 0; mix-blend-mode: overlay; opacity: .35; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .head { position: absolute; left: 92px; right: 92px; top: 318px; }
  .head h1 { margin: 0; font: 900 132px/.9 'Geist'; letter-spacing: -6px; }
  .head h1 em { font-style: normal; color: var(--mint); }
  .head p { margin: 26px 0 0 4px; font: 600 44px/1.15 'Geist'; color: var(--dim); letter-spacing: -.4px; }
  .series { position: absolute; right: 92px; top: 250px; font: 600 32px/1 'Geist Mono'; color: var(--dim); }

  .stack { position: absolute; left: 0; right: 0; top: 880px; height: 700px; perspective: 2400px; }
  .mail { position: absolute; left: 110px; width: 860px; height: 196px; border-radius: 30px; box-sizing: border-box; padding: 34px 40px;
    background: linear-gradient(180deg, #FBFBFA 0%, #ECEDEB 100%); color: #121417;
    box-shadow: 0 2px 0 rgba(255,255,255,.9) inset, 0 40px 80px rgba(0,0,0,.55), 0 10px 22px rgba(0,0,0,.35);
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 24px; row-gap: 12px; align-items: center; }
  .mail .from { font: 600 28px/1 'Geist Mono'; color: #6A6F76; }
  .mail .subj { grid-column: 1; font: 700 38px/1.1 'Geist'; white-space: nowrap; letter-spacing: -.6px; }
  .mail .tag { grid-column: 2; grid-row: 1 / span 2; font: 600 32px/1 'Geist Mono'; padding: 18px 24px; border-radius: 20px; }
  .m1 { top: 0; transform: rotateX(8deg) rotateZ(-3deg) translateX(-30px); }
  .m2 { top: 228px; transform: rotateX(8deg) rotateZ(1.5deg) translateX(26px); }
  .m3 { top: 456px; transform: rotateX(8deg) rotateZ(-1deg) translateX(-8px); }
  .billing { background: #0E1A15; color: var(--mint); }
  .tech { background: #0F1524; color: #8EB0FF; }
  .sales { background: #1F1A0E; color: #FFD27A; }
</style>
</head>
<body>
<div class="series">002</div>
<div class="head">
  <h1>AI sorts your<br>inbox. <em>Offline.</em></h1>
  <p>A free 9B model, running on your laptop.</p>
</div>
<div class="stack">
  <div class="mail m1"><span class="from">order #4821</span><span class="subj">I want my money back.</span><span class="tag billing">billing 91%</span></div>
  <div class="mail m2"><span class="from">login help</span><span class="subj">"invalid token" again</span><span class="tag tech">technical 88%</span></div>
  <div class="mail m3"><span class="from">partnership</span><span class="subj">Partnership, 40 seats?</span><span class="tag sales">sales 76%</span></div>
</div>
<div class="grain"></div>
<script type="module">
await document.fonts.load('900 40px Geist'); await document.fonts.load('600 40px "Geist Mono"'); await document.fonts.load('700 40px Geist');
window.READY = true;
</script>
</body>
</html>
